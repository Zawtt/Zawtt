<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" role="img" aria-labelledby="title desc">
  <title id="title">Rhythia 0.1.2 RHM Backport</title>
  <desc id="desc">Animated project card for the Rhythia RHM Backport repository</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86d67c"/>
      <stop offset="0.5" stop-color="#91a7ff"/>
      <stop offset="1" stop-color="#86d67c"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.35 0;0.35 0;-0.35 0" dur="7.8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86d67c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#86d67c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#86d67c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#86d67c" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="678" height="218" rx="18" fill="#111423" stroke="url(#border)" stroke-width="2"/>
  <rect x="2" y="2" width="676" height="216" rx="17" fill="url(#grid)"/>
  <rect x="-160" y="1" width="160" height="2" fill="url(#shine)">
    <animate attributeName="x" values="-160;680" dur="5.4s" repeatCount="indefinite"/>
  </rect>

  <circle cx="44" cy="43" r="6" fill="#91a7ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="62" y="49" fill="#9aa6c8" font-family="Consolas, monospace" font-size="15" letter-spacing="3">PROJECT 02</text>

  <text x="38" y="101" fill="#f2f4ff" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Rhythia RHM Backport</text>
  <text x="39" y="132" fill="#86d67c" font-family="Consolas, monospace" font-size="16">RHYTHIA 0.1.2 · C#</text>
  <text x="39" y="169" fill="#aeb6d1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Restored .rhm map import support for the legacy client</text>

  <g transform="translate(520 169)">
    <rect width="122" height="30" rx="15" fill="#86d67c" fill-opacity="0.10" stroke="#86d67c" stroke-opacity="0.5"/>
    <text x="61" y="20" text-anchor="middle" fill="#e1f5df" font-family="Consolas, monospace" font-size="12" letter-spacing="1">OPEN REPO  →</text>
  </g>
</svg>
